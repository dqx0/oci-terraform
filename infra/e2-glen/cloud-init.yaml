#cloud-config
package_update: true
package_upgrade: true
disable_root: true
ssh_pwauth: false
packages:
  - ca-certificates
  - fail2ban
  - ufw
  - unattended-upgrades

groups:
  - glen

users:
  - default
  - name: glen
    primary_group: glen
    system: true
    shell: /usr/sbin/nologin

write_files:
  - path: /etc/systemd/system/glen.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Glen authentication service
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=glen
      Group=glen
      EnvironmentFile=/etc/glen/environment
      ExecStart=/opt/glen/bin/glen
      Restart=on-failure
      RestartSec=5s
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectHome=true
      ProtectSystem=strict
      ReadWritePaths=/var/lib/glen
      MemoryHigh=600M
      MemoryMax=750M
      TasksMax=128

      [Install]
      WantedBy=multi-user.target
  - path: /etc/glen/environment
    owner: root:root
    permissions: "0600"
    content: |
      GLEN_LISTEN_ADDR=127.0.0.1:8080
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root:root
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [bash, -lc, "ufw allow from '${ssh_ingress_cidr}' to any port 22 proto tcp"]
  - [ufw, allow, "443/tcp"]
  - [ufw, --force, enable]
  - [mkdir, -p, /opt/glen/bin]
  - [mkdir, -p, /var/lib/glen]
  - [chown, "root:glen", /etc/glen/environment]
  - [chmod, "0640", /etc/glen/environment]
  - [chown, -R, "glen:glen", /opt/glen]
  - [chown, -R, "glen:glen", /var/lib/glen]
  - [bash, -lc, "test -f /swapfile || { fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile; }"]
  - [bash, -lc, "swapon --show=NAME --noheadings | grep -qx /swapfile || swapon /swapfile"]
  - [bash, -lc, "grep -q '^/swapfile ' /etc/fstab || printf '/swapfile none swap sw 0 0\\n' >> /etc/fstab"]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, fail2ban]
