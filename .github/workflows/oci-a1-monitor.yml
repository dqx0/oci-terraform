name: OCI A1 capacity monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oci-a1-monitor.yml"
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: oci-a1-capacity-monitor
  cancel-in-progress: false

jobs:
  create-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_availability_domain: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
      TF_VAR_subnet_ocid: ${{ secrets.OCI_SUBNET_OCID }}
      TF_VAR_image_ocid: ${{ vars.OCI_IMAGE_OCID }}
      TF_VAR_ssh_public_key: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
      TF_VAR_ocpus: ${{ vars.OCI_OCPUS || '1' }}
      TF_VAR_memory_in_gbs: ${{ vars.OCI_MEMORY_IN_GBS || '6' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Configure OCI API credentials
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"
          config_file="$HOME/.oci/config"
          key_file="$HOME/.oci/oci_api_key.pem"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          {
            printf '[DEFAULT]\n'
            printf 'user=%s\n' "$OCI_USER_OCID"
            printf 'fingerprint=%s\n' "$OCI_FINGERPRINT"
            printf 'tenancy=%s\n' "$OCI_TENANCY_OCID"
            printf 'region=%s\n' "$TF_VAR_region"
            printf 'key_file=%s\n' "$key_file"
          } > "$config_file"
          chmod 600 "$config_file"
          echo "OCI_CONFIG_FILE=$config_file" >> "$GITHUB_ENV"

      - name: Initialize remote state
        env:
          STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
          STATE_NAMESPACE: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="namespace=$STATE_NAMESPACE" \
            -backend-config="region=$TF_VAR_region" \
            -backend-config="key=oci-a1/terraform.tfstate" \
            -backend-config="config_file_profile=DEFAULT"

      - name: Validate configuration
        run: terraform validate

      - name: Try to create the instance
        id: apply
        run: |
          set -o pipefail
          set +e
          terraform apply -auto-approve -no-color 2>&1 | tee apply.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            echo "succeeded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Eiq \
            'out of (host )?capacity|capacity is not available|insufficient (host )?capacity' \
            apply.log; then
            echo "OCI has no matching A1 capacity; the next scheduled run will retry."
            echo "succeeded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Terraform failed for a reason other than unavailable capacity."
          exit "$status"

      - name: Show created instance
        if: steps.apply.outputs.succeeded == 'true'
        run: terraform output

      - name: Stop monitoring after success
        if: steps.apply.outputs.succeeded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/oci-a1-monitor.yml/disable"
